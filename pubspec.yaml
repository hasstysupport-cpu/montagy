name: montagy
description: "Montagy — مونتاجي: AI video editor & caption studio (CapCut-style, open source)."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State & routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Video / media
  video_player: ^2.9.1
  video_thumbnail: ^0.5.3
  ffmpeg_kit_flutter_new_full_gpl: ^2.6.0   # FFmpeg 7.1 fork (libass + fribidi + x264)
  just_audio: ^0.9.40

  # Files & platform
  file_picker: ^8.1.2
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  path: ^1.9.0
  permission_handler: ^11.3.1
  share_plus: ^10.0.2
  gal: ^2.3.0                              # save video to gallery
  url_launcher: ^6.3.0
  shared_preferences: ^2.3.2

  # UI
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1

  # Utils
  http: ^1.2.2
  uuid: ^4.5.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/

  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
    - family: Almarai
      fonts:
        - asset: assets/fonts/Almarai-Regular.ttf
        - asset: assets/fonts/Almarai-Bold.ttf
          weight: 700
    - family: Anton
      fonts:
        - asset: assets/fonts/Anton-Regular.ttf
    - family: BebasNeue
      fonts:
        - asset: assets/fonts/BebasNeue-Regular.ttf
    - family: Lalezar
      fonts:
        - asset: assets/fonts/Lalezar-Regular.ttf
