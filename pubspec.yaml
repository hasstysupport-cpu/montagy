name: montagy
description: "Montagy — مونتاجي: استوديو مونتاج فيديو احترافي (قوة CapCut وبساطة InShot في تطبيق واحد)."
publish_to: "none"
version: 2.0.0+8

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Media playback & processing
  video_player: ^2.9.2
  video_thumbnail: ^0.5.3
  ffmpeg_kit_flutter_new_gpl: ^1.6.5   # full-gpl build (x264 + fribidi + freetype)
  just_audio: ^0.9.40

  # Files & platform
  file_picker: ^8.1.2
  path_provider: ^2.1.4
  path: ^1.9.0
  permission_handler: ^11.3.1
  share_plus: ^10.0.2
  gal: ^2.3.0
  shared_preferences: ^2.3.2
  record: ^5.1.2

  # Utils
  uuid: ^4.5.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/

  fonts:
    # ── خط الواجهة الرئيسي (عربي + لاتيني، عصري فخم) ──
    - family: Alexandria
      fonts:
        - asset: assets/fonts/Alexandria.ttf
    # ── خطوط أداة النص ──
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
    - family: ReemKufi
      fonts:
        - asset: assets/fonts/ReemKufi.ttf
    - family: ElMessiri
      fonts:
        - asset: assets/fonts/ElMessiri.ttf
    - family: Changa
      fonts:
        - asset: assets/fonts/Changa.ttf
    - family: Lalezar
      fonts:
        - asset: assets/fonts/Lalezar-Regular.ttf
    - family: BalooBhaijaan2
      fonts:
        - asset: assets/fonts/BalooBhaijaan2.ttf
    - family: ArefRuqaa
      fonts:
        - asset: assets/fonts/ArefRuqaa-Regular.ttf
        - asset: assets/fonts/ArefRuqaa-Bold.ttf
          weight: 700
    - family: Marhey
      fonts:
        - asset: assets/fonts/Marhey.ttf
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
    - family: Rubik
      fonts:
        - asset: assets/fonts/Rubik.ttf
    - family: BebasNeue
      fonts:
        - asset: assets/fonts/BebasNeue-Regular.ttf
    - family: Pacifico
      fonts:
        - asset: assets/fonts/Pacifico-Regular.ttf
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay.ttf
