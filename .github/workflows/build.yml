name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to create Releases and upload APK assets
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter (pinned 3.27.4)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      # flutter create . must not touch our source files — back them up first
      - name: Backup source files
        run: |
          mkdir -p /tmp/montagy-bak
          cp -r lib /tmp/montagy-bak/lib
          cp pubspec.yaml README.md analysis_options.yaml /tmp/montagy-bak/

      - name: Scaffold android platform (flutter create)
        run: flutter create . --org com.montagy --project-name montagy --platforms android

      - name: Restore source files
        run: |
          cp -r /tmp/montagy-bak/lib/* lib/
          cp /tmp/montagy-bak/pubspec.yaml pubspec.yaml
          cp /tmp/montagy-bak/README.md README.md
          cp /tmp/montagy-bak/analysis_options.yaml analysis_options.yaml

      # Same steps as setup.sh
      - name: Apply Montagy android patches
        run: |
          cp android_patch/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp android_patch/app_build.gradle android/app/build.gradle
          mkdir -p android/app/src/main/res/xml
          cp android_patch/file_paths.xml android/app/src/main/res/xml/file_paths.xml
          # Launcher icons (custom Montagy brand) — must come AFTER flutter create
          cp -r android_patch/res/. android/app/src/main/res/
          mkdir -p android/app/src/main/kotlin/com/montagy/app
          cp android_patch/MainActivity.kt android/app/src/main/kotlin/com/montagy/app/MainActivity.kt
          echo "android.suppressUnsupportedCompileSdk=35" >> android/gradle.properties

      - name: Pub get
        run: flutter pub get

      # Our custom signing config points at the debug keystore but AGP only
      # auto-generates that for its built-in "debug" config — create it here.
      - name: Ensure debug keystore exists
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          ls -la ~/.android/debug.keystore

      # ffmpeg_kit_flutter_android's setup script points to a missing release
      # asset (downloads a 9-byte "Not Found"). Pre-place the official Arthenica
      # full-gpl LTS AAR (mirrored by sk3llo) so the plugin skips its download.
      # Contains: libass + fribidi + x264 (verified), all 4 ABIs.
      - name: Provide FFmpegKit Android AAR
        run: |
          PKG_DIR=$(ls -d /home/runner/.pub-cache/hosted/pub.dev/ffmpeg_kit_flutter_android-*/ | head -1)
          echo "plugin dir: $PKG_DIR"
          mkdir -p "$PKG_DIR/android/libs"
          curl -fL --retry 3 -o "$PKG_DIR/android/libs/com.arthenica.ffmpegkit-flutter-7.0.aar" \
            "https://github.com/sk3llo/ffmpeg_kit_flutter/releases/download/6.0.2/ffmpeg-kit-full-gpl-6.0.LTS.aar"
          ls -lh "$PKG_DIR/android/libs/"

      - name: Read app version
        run: echo "VERSION=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d'+' -f1)" >> $GITHUB_ENV

      - name: Build release APK (universal)
        run: flutter build apk --release

      # Smaller per-ABI APKs — arm64-only is ~1/3 the size and far more
      # reliable to download on mobile data. Gradle reuses cached artifacts,
      # so this second build is fast.
      - name: Build arm64 split APK
        run: flutter build apk --release --split-per-abi

      - name: Prepare APKs + checksums
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk Montagy-v$VERSION.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk Montagy-v$VERSION-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk Montagy-v$VERSION-armv7.apk
          ls -lh Montagy-v$VERSION.apk Montagy-v$VERSION-arm64.apk Montagy-v$VERSION-armv7.apk
          sha256sum Montagy-v$VERSION.apk Montagy-v$VERSION-arm64.apk Montagy-v$VERSION-armv7.apk | tee SHA256SUMS.txt
          {
            echo '### SHA-256 checksums'
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
            echo
            echo '⚠️ لو الملف اللي نزل عندك حجمه مختلف عن اللي فوق — التحميل اتقطع، نزّله تاني.'
          } > release_notes.md

      - name: Verify APK signatures (diagnostic)
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          echo "== universal =="
          $APKSIGNER verify --verbose build/app/outputs/flutter-apk/app-release.apk | head -8
          echo "== arm64 =="
          $APKSIGNER verify --verbose build/app/outputs/flutter-apk/app-arm64-v8a-release.apk | head -8

      - name: Upload artifact (90 days)
        uses: actions/upload-artifact@v4
        with:
          name: Montagy-APK
          path: |
            Montagy-v${{ env.VERSION }}.apk
            Montagy-v${{ env.VERSION }}-arm64.apk
            Montagy-v${{ env.VERSION }}-armv7.apk
            SHA256SUMS.txt
          retention-days: 90

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Montagy APK — Build #${{ github.run_number }}
          body_path: release_notes.md
          append_body: true
          body: |
            📱 **مونتاجي v${{ env.VERSION }}** — استوديو مونتاج كامل (قوة CapCut + بساطة InShot)

            **جديد في v2.1 — تحكم بنمط CapCut/InShot:**
            - شريط أدوات سياقي: أدوات المقطع تظهر عند تحديده (تقسيم/سرعة/حجم/تدوير/عكس/تجميد/استخراج صوت/استبدال)
            - ضغط طويل على المقطع = سحب لإعادة الترتيب | سحب الصوت والنصوص لتغيير توقيتها مع الالتصاق بالمؤشر
            - تدوير النصوص والملصقات بلف إصبعين + تكبير بالقرص + خطوط توسيط بالالتصاق
            - تراجع + إعادة | ثيم داكن أزرق/أسود + فاتح أخضر/أبيض | خط عربي فاخر Alexandria
            - مقاطع متعددة + تايم لاين متعدد التراكات (قص/تشذيب/سرعة/اقتصاص) + 40+ فلتر + تعديل لوني + انتقالات
            - نصوص عربية بخطوط فاخرة + ملصقات + موسيقى وتعليق صوتي + كانفس
            - تصدير MP4 حقيقي بجودة حتى 1080p/2K مع تقدم مباشر
            - Built automatically from commit `${{ github.sha }}`
            - **Montagy-v${{ env.VERSION }}-arm64.apk** ← لجميع الموبايلات الحديثة ✅ حمّل ده
            - Montagy-v${{ env.VERSION }}-armv7.apk — للأجهزة الأقدم 32-bit
            - Montagy-v${{ env.VERSION }}.apk — Universal (كل المعالجات)
            - Install: download → open → allow "install unknown apps"

            ⚠️ Debug-signed build — for personal use / testing only.
          files: |
            Montagy-v${{ env.VERSION }}.apk
            Montagy-v${{ env.VERSION }}-arm64.apk
            Montagy-v${{ env.VERSION }}-armv7.apk
          make_latest: true
