plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: '1'
def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '1.0'

android {
    namespace = "com.montagy.app"
    compileSdk = 35
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        applicationId = "com.montagy.app"
        minSdk = 24          // FFmpegKit needs 24+
        targetSdk = 35
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
        multiDexEnabled = true
    }

    signingConfigs {
        // Same auto-generated debug keystore, but force BOTH v1 (JAR) and
        // v2 signature schemes. AGP silently drops v1 when minSdk >= 24,
        // and some Android devices/installers refuse v2-only APKs with
        // "package appears to be invalid". Explicit v1 fixes sideloading.
        montagy {
            storeFile file("${System.getProperty('user.home')}/.android/debug.keystore")
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
            enableV1Signing true
            enableV2Signing true
        }
    }

    buildTypes {
        release {
            // TODO: add your signing config for Play Store release
            signingConfig = signingConfigs.montagy
            minifyEnabled = false
            shrinkResources = false
        }
    }

    packagingOptions {
        // ffmpeg_kit native libs
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

flutter {
    source = '../..'
}

dependencies {
    implementation "androidx.multidex:multidex:2.0.1"
    implementation "androidx.core:core-ktx:1.13.1"
}
